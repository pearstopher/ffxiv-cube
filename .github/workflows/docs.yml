name: Docs

# Checks the committed Markdown code reference (docs/reference/) matches the code, builds the HTML site
# from the code's XML doc comments with DocFX (warnings are errors), and publishes the site to GitHub Pages
# from main. The Markdown reference is the one linked from the README; Pages is optional.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        # The plugin project references Dalamud, and DocFX needs it to read that project's code.
        timeout-minutes: 5
        shell: pwsh
        run: |
          $dalamudHome = Join-Path $env:RUNNER_TEMP "dalamud"
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip $dalamudHome
          "DALAMUD_HOME=$dalamudHome" >> $env:GITHUB_ENV

      - name: Restore tools
        run: dotnet tool restore

      - name: Check the Markdown code reference is up to date
        # docs/reference/ is committed so it can be read on GitHub without Pages. It must match the code.
        timeout-minutes: 10
        shell: pwsh
        run: |
          python scripts/build-docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changes = git status --porcelain -- docs/reference
          if ($changes) {
            Write-Output $changes
            Write-Error "docs/reference/ is out of date. Run 'python scripts/build-docs.py' and commit the result."
            exit 1
          }

      - name: Build docs site
        timeout-minutes: 10
        run: dotnet docfx docs/docfx.json --warningsAsErrors

      - name: Upload site
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
