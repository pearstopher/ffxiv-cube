name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # Daily build against the latest Dalamud, so a Dalamud or game patch that breaks the
  # plugin shows up as a failed run (GitHub emails the repo owner) even with no new commits.
  schedule:
    - cron: '23 9 * * *'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # A normal run takes a minute or two. Fail instead of hanging for GitHub's 6-hour default.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        timeout-minutes: 5
        shell: pwsh
        run: |
          $dalamudHome = Join-Path $env:RUNNER_TEMP "dalamud"
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip $dalamudHome
          "DALAMUD_HOME=$dalamudHome" >> $env:GITHUB_ENV

      - name: Restore (locked)
        # The committed packages.lock.json must match; a silent dependency change fails here.
        timeout-minutes: 5
        run: dotnet restore --locked-mode

      - name: Build
        timeout-minutes: 5
        run: dotnet build --configuration Release --no-restore

      - name: Test
        timeout-minutes: 5
        run: dotnet test --configuration Release --no-build

      - name: Test scripts
        # The in-game test script's decisions (fresh results, exit codes) are unit tested too.
        timeout-minutes: 2
        run: python -m unittest discover -s scripts

      - name: Upload plugin package
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: Cube
          path: Cube/bin/x64/Release/Cube/*
          if-no-files-found: error
          retention-days: 7
