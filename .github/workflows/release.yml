name: Release

# Pushing a tag like v1.2.3 builds and tests the plugin, publishes a GitHub Release with
# latest.zip, and updates repo.json on main (the custom repo added in Dalamud's settings).
on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

# Never run two releases at once: both would try to push repo.json to main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        timeout-minutes: 5
        shell: pwsh
        run: |
          $dalamudHome = Join-Path $env:RUNNER_TEMP "dalamud"
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip $dalamudHome
          "DALAMUD_HOME=$dalamudHome" >> $env:GITHUB_ENV

      # The version lives in the csproj, because Dalamud's build bot builds the commit as-is.
      - name: Check the tag matches the csproj version
        timeout-minutes: 1
        shell: pwsh
        run: |
          # v1.2.3 -> 1.2.3.0 (Dalamud uses four-part assembly versions)
          $expected = "$env:GITHUB_REF_NAME".TrimStart('v') + ".0"
          $actual = (Select-Xml -Path Cube/Cube.csproj -XPath '//Version').Node.InnerText.Trim()
          if ($actual -ne $expected) {
            Write-Output "::error::Tag $env:GITHUB_REF_NAME needs <Version>$expected</Version> in Cube/Cube.csproj, but it says $actual. Bump the csproj, then tag that commit."
            exit 1
          }
          Write-Output "Version $actual matches tag $env:GITHUB_REF_NAME"

      - name: Restore (locked)
        timeout-minutes: 5
        run: dotnet restore --locked-mode

      - name: Build
        timeout-minutes: 5
        run: dotnet build --configuration Release --no-restore

      # Includes ReleaseBuildTests: the Release DLL must not contain the Debug-only test bridge.
      - name: Test
        timeout-minutes: 5
        run: dotnet test --configuration Release --no-build

      - name: Test scripts
        timeout-minutes: 2
        run: python -m unittest discover -s scripts

      - name: Publish GitHub Release
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" Cube/bin/x64/Release/Cube/latest.zip --title "Cube ${{ github.ref_name }}" --generate-notes

      - name: Update repo.json on main
        timeout-minutes: 2
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python scripts/make_repo_json.py Cube/bin/x64/Release/Cube/Cube.json "$env:GITHUB_REF_NAME" "$env:GITHUB_REPOSITORY" repo.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "Update repo.json for $env:GITHUB_REF_NAME [skip ci]"
          git push origin main
